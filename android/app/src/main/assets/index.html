<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indian Web Browser</title><h1>🇮🇳 Indian Web Browser</h1><form onsubmit="go();return false"><input id="q" placeholder="Search Google or URL"><button>Search</button></form><script>function go(){let q=document.getElementById('q').value.trim();if(!q)return;location.href=/^https?:\\/\\//i.test(q)?q:'https://www.google.com/search?q='+encodeURIComponent(q)}</script>
