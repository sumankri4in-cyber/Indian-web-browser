name: Build Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indian-web-browser-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: warn
