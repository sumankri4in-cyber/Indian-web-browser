<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Web Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="flag">🇮🇳</span><b>Indian Web Browser</b></div>
  <button id="privacy" class="icon" title="Privacy mode">🛡️</button>
</header>
<main>
  <section class="hero">
    <div class="logo">INDIA</div>
    <h1>Search the web</h1>
    <p>Fast, simple and privacy-friendly.</p>
    <form id="searchForm" class="search">
      <input id="query" autocomplete="off" placeholder="Search Google or enter a URL" aria-label="Search">
      <button aria-label="Search">🔎</button>
    </form>
    <div class="chips">
      <button data-q="Indian news">News</button><button data-q="weather India">Weather</button>
      <button data-q="maps India">Maps</button><button data-q="Wikipedia India">Wikipedia</button>
    </div>
  </section>
  <section class="cards">
    <a href="https://www.google.com/" target="_blank">Google<span>Search</span></a>
    <a href="https://www.youtube.com/" target="_blank">YouTube<span>Videos</span></a>
    <a href="https://www.wikipedia.org/" target="_blank">Wikipedia<span>Knowledge</span></a>
    <a href="https://www.india.gov.in/" target="_blank">India.gov.in<span>Government</span></a>
  </section>
</main>
<footer>Indian Web Browser • Your searches open in Google • <span id="status">Privacy mode off</span></footer>
<script src="app.js"></script>
</body>
</html>
